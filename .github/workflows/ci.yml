name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer update --no-interaction --prefer-dist --no-progress
      - run: composer lint
      - run: composer analyse
      - run: composer test

  # The shield policy (Swift and Kotlin, same cases) and an Android typecheck of the bridge code
  # against android.jar. iOS typechecking needs Xcode: run bin/typecheck-ios locally.
  native:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36"
      - name: Kotlin policy tests and Android typecheck
        working-directory: resources/android
        run: ./gradlew test compileHostCheckKotlin --console=plain
      - name: Swift policy tests
        run: |
          swift --version
          swift test --package-path resources/ios
