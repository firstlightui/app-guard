name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # The job must be named `quality`: the org ruleset requires `quality / static` and `quality / tests`.
  quality:
    permissions:
      contents: read
    uses: clinically-au/.github/.github/workflows/quality.yml@main
    secrets: inherit
    with:
      require: pint,phpstan,pest
      min-tests: 16

  # forge-control still runs PHP 8.4, so prove the package installs and passes there too.
  php84:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer update --no-interaction --prefer-dist --no-progress
      - run: composer test

  # The shield policy (Swift and Kotlin, same cases) and an Android typecheck of the bridge code
  # against android.jar. iOS typechecking needs Xcode: run bin/typecheck-ios locally.
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36"
      - name: Kotlin policy tests and Android typecheck
        working-directory: resources/android
        run: ./gradlew test compileHostCheckKotlin --console=plain
      - name: Swift policy tests
        run: |
          swift --version
          swift test --package-path resources/ios
